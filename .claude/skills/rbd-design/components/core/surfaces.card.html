<!-- @dsCard group="Components" viewport="700x300" name="Callouts, Cards & Stats" subtitle="Research-question boxes, surfaces, headline figures" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bg-canvas); padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stats { display: flex; gap: 36px; padding-top: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Callout, Card, Stat, Eyebrow } = window.ReginaDeBritoDuarteDesignSystem_6df855;
  function Demo() {
    return (
      <div style={{display:'flex', flexDirection:'column', gap:16}}>
        <div className="grid">
          <Callout variant="coral" label="RQ1">Does explanation design calibrate a person's reliance on AI advice?</Callout>
          <Callout variant="iris" label="Finding">Explanations reduced over-reliance most in group decision settings.</Callout>
        </div>
        <div className="grid">
          <Card variant="default" padding={2}>
            <Eyebrow>Project</Eyebrow>
            <div style={{fontFamily:'var(--font-display)', fontWeight:700, fontSize:18, marginTop:6, color:'var(--ink-900)'}}>Calibrating Reliance</div>
            <div style={{fontSize:14, color:'var(--text-muted)', marginTop:4}}>A white card on the ivory canvas.</div>
          </Card>
          <Card variant="iris" padding={2}>
            <Eyebrow variant="iris">Tinted</Eyebrow>
            <div style={{fontFamily:'var(--font-display)', fontWeight:700, fontSize:18, marginTop:6, color:'var(--ink-900)'}}>Iris surface</div>
            <div style={{fontSize:14, color:'var(--text-muted)', marginTop:4}}>For grouping & emphasis.</div>
          </Card>
        </div>
        <div className="stats">
          <Stat sub="Sample" value={<>1,2<em>40</em></>} label="participants, 4 studies" />
          <Stat variant="coral" value="3×" label="faster trust calibration" />
          <Stat variant="iris" value="−27%" label="over-reliance in groups" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>

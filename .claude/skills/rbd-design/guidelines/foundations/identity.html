<!-- @dsCard group="Brand" viewport="700x230" name="Identity — wordmark" subtitle="Personal mark: rbd monogram (Regina de Brito Duarte) + wordmark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bg-canvas); padding: 26px; font-family: var(--font-text); }
  .stack { display: flex; flex-direction: column; gap: 26px; }
  .lockup { display: flex; align-items: center; gap: 16px; }
  .mark {
    width: 58px; height: 58px; border-radius: 16px; flex: none;
    background: var(--coral-300); color: var(--ink-900);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 800; font-size: 23px; letter-spacing: -0.06em;
    box-shadow: var(--shadow-accent);
  }
  .mark--ink { background: var(--ink-900); color: var(--ivory); box-shadow: var(--shadow-sm); }
  .mark--out { background: transparent; color: var(--ink-900); box-shadow: inset 0 0 0 2px var(--ink-300); }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 26px; color: var(--ink-900); letter-spacing: -0.02em; line-height: 1; }
  .role { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-text); margin-top: 7px; }
  .variants { display:flex; align-items:center; gap: 14px; margin-top: 4px; }
  .variants .lbl { font-family:var(--font-mono); font-size:11px; color:var(--text-faint); letter-spacing:.08em; }
</style>
</head>
<body>
  <div class="stack">
    <div class="lockup">
      <div class="mark">rbd</div>
      <div>
        <div class="name">Regina de Brito Duarte</div>
        <div class="role">AI · HCI · Evidence-based policy</div>
      </div>
    </div>
    <div class="variants">
      <span class="lbl">MARK</span>
      <div class="mark" style="width:44px;height:44px;font-size:18px;border-radius:12px">rbd</div>
      <div class="mark mark--ink" style="width:44px;height:44px;font-size:18px;border-radius:12px">rbd</div>
      <div class="mark mark--out" style="width:44px;height:44px;font-size:18px;border-radius:12px">rbd</div>
    </div>
  </div>
</body>
</html>

<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid · space-1 → space-16" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bg-canvas); padding: 22px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--coral-300); border-radius: 4px; width: 26px; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="height:4px"></div><span class="tok">1·4</span></div>
    <div class="col"><div class="bar" style="height:8px"></div><span class="tok">2·8</span></div>
    <div class="col"><div class="bar" style="height:12px"></div><span class="tok">3·12</span></div>
    <div class="col"><div class="bar" style="height:16px"></div><span class="tok">4·16</span></div>
    <div class="col"><div class="bar" style="height:24px"></div><span class="tok">6·24</span></div>
    <div class="col"><div class="bar" style="height:32px"></div><span class="tok">8·32</span></div>
    <div class="col"><div class="bar" style="height:48px"></div><span class="tok">12·48</span></div>
    <div class="col"><div class="bar" style="height:64px"></div><span class="tok">16·64</span></div>
  </div>
</body>
</html>

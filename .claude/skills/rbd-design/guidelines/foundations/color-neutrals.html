<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — ink on ivory" subtitle="Warm canvas and the ink text ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bg-canvas); padding: 22px; }
  .ramp { display: flex; gap: 8px; }
  .chip { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .sw { height: 64px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--border); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-body); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="chip"><div class="sw" style="background:var(--ivory)"></div><span class="name">ivory</span><span class="hex">#FAF6EF</span></div>
    <div class="chip"><div class="sw" style="background:var(--cream)"></div><span class="name">cream</span><span class="hex">#F3ECE0</span></div>
    <div class="chip"><div class="sw" style="background:var(--ink-100)"></div><span class="name">ink-100</span><span class="hex">#ECE6DC</span></div>
    <div class="chip"><div class="sw" style="background:var(--ink-300)"></div><span class="name">ink-300</span><span class="hex">#B6ACA0</span></div>
    <div class="chip"><div class="sw" style="background:var(--ink-500)"></div><span class="name">ink-500</span><span class="hex">#6B635B</span></div>
    <div class="chip"><div class="sw" style="background:var(--ink-700)"></div><span class="name">ink-700</span><span class="hex">#463F39</span></div>
    <div class="chip"><div class="sw" style="background:var(--ink-900)"></div><span class="name">ink-900</span><span class="hex">#1E1B18</span></div>
  </div>
</body>
</html>

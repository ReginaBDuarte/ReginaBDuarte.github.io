<!-- @dsCard group="Colors" viewport="700x150" name="Coral — signature" subtitle="The brand accent, sampled from the deck (#F6956A)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--bg-canvas); padding: 22px; }
  .ramp { display: flex; gap: 8px; }
  .chip { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .sw { height: 64px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-body); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; }
  .base { box-shadow: inset 0 0 0 2px var(--ink-900); }
</style>
</head>
<body>
  <div class="ramp">
    <div class="chip"><div class="sw" style="background:var(--coral-100)"></div><span class="name">coral-100</span><span class="hex">#FED9C3</span></div>
    <div class="chip"><div class="sw" style="background:var(--coral-200)"></div><span class="name">coral-200</span><span class="hex">#FBBF9F</span></div>
    <div class="chip"><div class="sw base" style="background:var(--coral-300)"></div><span class="name">coral-300 ◆</span><span class="hex">#F6956A</span></div>
    <div class="chip"><div class="sw" style="background:var(--coral-400)"></div><span class="name">coral-400</span><span class="hex">#EF7E4C</span></div>
    <div class="chip"><div class="sw" style="background:var(--coral-500)"></div><span class="name">coral-500</span><span class="hex">#E2682F</span></div>
    <div class="chip"><div class="sw" style="background:var(--coral-600)"></div><span class="name">coral-600</span><span class="hex">#C2541F</span></div>
    <div class="chip"><div class="sw" style="background:var(--coral-700)"></div><span class="name">coral-700</span><span class="hex">#9E4317</span></div>
  </div>
</body>
</html>
